<style>
  :root { --paper:#f4f2ee; --ink:#15140f; --muted:#5f5b53; --line:#dcd8cf;
          --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100svh; display:grid; place-items:center; padding:2rem;
         background:var(--paper); color:var(--ink); font-family:var(--sans);
         font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased; }
  main { width:100%; max-width:720px; }
  .mark { display:inline-grid; place-items:center; width:32px; height:32px;
          background:var(--ink); color:var(--paper); font-weight:600; font-size:.8rem; }
  p.k { font-size:.7rem; font-weight:500; letter-spacing:.02em;
        color:var(--muted); margin:2.5rem 0 1rem; }
  h1 { font-weight:600; font-size:clamp(2.1rem,6vw,3.4rem);
       line-height:1.06; letter-spacing:-.03em; margin:0; text-wrap:balance; }
  p.d { color:var(--muted); font-size:1.0625rem; line-height:1.65;
        max-width:42ch; margin:1.5rem 0 2.5rem; }
  a { display:inline-block; color:var(--ink); font-size:.72rem; font-weight:500;
      letter-spacing:.02em; text-decoration:none;
      border-bottom:1px solid var(--line); padding-bottom:.4rem; }
  a:hover { border-bottom-color:var(--ink); }
</style>
</head>
