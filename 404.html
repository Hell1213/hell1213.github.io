<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Rajat Yadav</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root { --paper:#f4f2ee; --ink:#111110; --muted:#6e6b64; --line:#d8d4cc;
          --serif:"Instrument Serif",Georgia,serif; --sans:"Inter",system-ui,sans-serif;
          --mono:"JetBrains Mono",ui-monospace,monospace; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100svh; display:grid; place-items:center; padding:2rem;
         background:var(--paper); color:var(--ink); font-family:var(--sans); }
  main { width:100%; max-width:720px; }
  .mark { display:inline-grid; place-items:center; width:34px; height:34px;
          background:var(--ink); color:var(--paper); font-family:var(--serif); font-size:1rem; }
  p.k { font-family:var(--mono); font-size:.62rem; letter-spacing:.16em;
        text-transform:uppercase; color:var(--muted); margin:2.5rem 0 1rem; }
  h1 { font-family:var(--serif); font-weight:400; font-size:clamp(3rem,10vw,6rem);
       line-height:.95; letter-spacing:-.02em; margin:0; }
  p.d { color:var(--muted); font-weight:300; font-size:1.05rem; line-height:1.6;
        max-width:40ch; margin:1.5rem 0 2.5rem; }
  a { display:inline-block; color:var(--ink); font-family:var(--mono); font-size:.64rem;
      letter-spacing:.12em; text-transform:uppercase; text-decoration:none;
      border-bottom:1px solid var(--line); padding-bottom:.4rem; }
  a:hover { border-bottom-color:var(--ink); }
</style>
</head>
<body>
<main>
  <span class="mark">RY</span>
  <p class="k">Error 404</p>
  <h1>This page took<br>a different route.</h1>
  <p class="d">The address you followed does not exist here. The fleet map, however, is exactly where you left it.</p>
  <a href="/">← Back to the field note</a>
</main>
</body>
</html>
